<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فجر الإسلام</title>
<meta name="description" content="موشن جرافيك مدته دقيقة عن بدايات العصر الإسلامي (٥٧٠ – ٦٣٢م)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020306;--gold:#d9b25f;--cream:#f4e9d2;--panel:rgba(8,10,16,.72)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--cream);font-family:'Reem Kufi',sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#c{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#000}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at center,rgba(20,28,48,.55),rgba(2,3,6,.92));cursor:pointer;z-index:5;transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
#start .btn{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(217,178,95,.35)}
#start .btn::after{content:"";border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent var(--gold);margin-left:8px}
#start h1{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:clamp(34px,6vw,64px);margin:0}
#start p{margin:0;opacity:.7;font-size:clamp(14px,2vw,18px)}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 16px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:4;transition:opacity .4s;direction:ltr}
#ui.idle{opacity:0}
#ui button{background:none;border:1px solid rgba(217,178,95,.5);color:var(--gold);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
#bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);position:relative;cursor:pointer}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,#8a6424,#f0cf7a)}
#time{font-variant-numeric:tabular-nums;font-size:14px;opacity:.8;min-width:84px;text-align:center}
body.render #ui,body.render #start{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start"><div class="btn"></div><h1>فجر الإسلام</h1><p>موشن جرافيك · دقيقة واحدة · يُفضّل تشغيل الصوت</p></div>
<div id="ui" class="idle">
  <button id="pp" aria-label="تشغيل/إيقاف">❚❚</button>
  <div id="bar"><div id="fill"></div></div>
  <span id="time">0:00 / 1:00</span>
  <button id="fs" aria-label="ملء الشاشة">⤢</button>
</div>
<audio id="snd" src="assets/islamic-dawn-soundtrack.m4a" preload="auto"></audio>
<script>
(() => {
'use strict';
const W = 1920, H = 1080, DUR = 60;
const RENDER = /[?&]render\b/.test(location.search);
if (RENDER) document.body.classList.add('render');

const cv = document.getElementById('c');
const main = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const LAYERS = [mk(W, H), mk(W, H)].map(c => ({ c, x: c.getContext('2d') }));
let g = main;

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eo = p => 1 - Math.pow(1 - p, 3);
const eo5 = p => 1 - Math.pow(1 - p, 5);
const back = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const ss = (a, b, x) => { const p = seg(x, a, b); return p * p * (3 - 2 * p); };
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };

/* ---------- text system (cached glyph layers + wipe/shine/blur) ---------- */
const FONTS = { ruqaa: '"Aref Ruqaa","Amiri",serif', amiri: '"Amiri",serif', kufi: '"Reem Kufi",sans-serif' };
const TC = new Map();
const measurer = mk(8, 8).getContext('2d');
function tex(str, fam, size, weight, fill, glow, gc) {
  if (fam === 'kufi' && /[٠-٩]/.test(str)) { fam = 'amiri'; weight = 700; } // Kufi digits & final meem read poorly
  const key = [str, fam, size, weight, fill, glow, gc].join('|');
  let o = TC.get(key); if (o) return o;
  const font = `${weight} ${size}px ${FONTS[fam]}`;
  measurer.font = font;
  const mw = measurer.measureText(str).width;
  const pad = Math.ceil(size * .35 + glow * 1.6);
  const w = Math.ceil(mw + pad * 2), h = Math.ceil(size * 1.9 + pad * 2);
  const c = mk(w, h), x = c.getContext('2d');
  x.font = font; x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = fill;
  if (fill === 'gold') {
    fs = x.createLinearGradient(0, h / 2 - size * .55, 0, h / 2 + size * .55);
    fs.addColorStop(0, '#fff6d6'); fs.addColorStop(.38, '#f0cf7a'); fs.addColorStop(.72, '#c9973c'); fs.addColorStop(1, '#8f6626');
  } else if (fill === 'cream') fs = '#f4e9d2';
  x.fillStyle = fs;
  if (glow) {
    x.shadowColor = gc || (fill === 'gold' ? 'rgba(240,185,85,.6)' : 'rgba(255,225,170,.35)');
    x.shadowBlur = glow; x.fillText(str, w / 2, h / 2); x.shadowBlur = 0;
  }
  x.fillText(str, w / 2, h / 2);
  o = { c, w, h }; TC.set(key, o); return o;
}
const SC = mk(2600, 900), sx = SC.getContext('2d');
function drawTex(im, x, y, o) {
  const a = o.alpha; if (a <= .003) return;
  let src = im.c;
  const rv = o.reveal ?? 1, sh = o.shine, doSh = sh != null && sh > 0 && sh < 1;
  if (rv < .999 || doSh) {
    if (SC.width < im.w || SC.height < im.h) { SC.width = Math.max(SC.width, im.w); SC.height = Math.max(SC.height, im.h); }
    sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, im.w, im.h); sx.drawImage(im.c, 0, 0);
    if (rv < .999) { // right-to-left feathered wipe
      const f = im.w * .3, e = im.w - rv * (im.w + f);
      const gr = sx.createLinearGradient(e, 0, e + f, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, '#000');
      sx.globalCompositeOperation = 'destination-in'; sx.fillStyle = gr; sx.fillRect(0, 0, im.w, im.h);
    }
    if (doSh) {
      const c = im.w * (1.15 - 1.3 * sh), bw = Math.max(70, im.w * .12);
      const gr = sx.createLinearGradient(c - bw, 0, c + bw, 0);
      gr.addColorStop(0, 'rgba(255,250,235,0)'); gr.addColorStop(.5, 'rgba(255,250,235,.9)'); gr.addColorStop(1, 'rgba(255,250,235,0)');
      sx.globalCompositeOperation = 'source-atop'; sx.fillStyle = gr; sx.fillRect(0, 0, im.w, im.h);
    }
    sx.globalCompositeOperation = 'source-over'; src = SC;
  }
  g.save(); g.globalAlpha = Math.min(1, a);
  if (o.blur > .4) g.filter = `blur(${o.blur.toFixed(1)}px)`;
  g.translate(x, y); const s = o.scale ?? 1; if (s !== 1) g.scale(s, s);
  g.drawImage(src, 0, 0, im.w, im.h, -im.w / 2, -im.h / 2, im.w, im.h);
  g.restore();
}
// animated text: appears at t0, leaves at t1 (or with its scene)
function T(str, fam, size, x, y, t, t0, t1, o = {}) {
  if (t < t0 - .01 || (t1 != null && t > t1 + .01)) return;
  const im = tex(str, fam, size, o.w ?? 700, o.fill ?? 'cream', o.glow ?? 0, o.gc);
  const din = o.din ?? 1;
  const pin = eo(seg(t, t0, t0 + din));
  const pout = t1 != null ? eio(seg(t, t1 - (o.dout ?? .6), t1)) : 0;
  drawTex(im, x, y + (1 - pin) * (o.rise ?? 26) - pout * 14, {
    alpha: pin * (1 - pout) * (o.a ?? 1),
    reveal: o.wipe === false ? 1 : eo(seg(t, t0, t0 + din * 1.3)),
    blur: (1 - pin) * (o.bl ?? 10) + pout * 8,
    scale: (o.s ?? 1) * lerp(o.s0 ?? 1, 1, eo5(seg(t, t0, t0 + din * 1.8))) * (1 + Math.max(0, t - t0) * (o.drift ?? .004)),
    shine: o.shine ? seg(t, t0 + .7, t0 + 2.1) : null,
  });
}

/* ---------- painting helpers ---------- */
function sky(stops) { const gr = g.createLinearGradient(0, 0, 0, H); stops.forEach(([p, c]) => gr.addColorStop(p, c)); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function glow(x, y, r, col, a, mode = 'lighter') {
  if (a <= .002 || r <= 1) return;
  g.save(); g.globalCompositeOperation = mode; g.globalAlpha = Math.min(1, a);
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
const STARS = (() => { const r = rng(7), a = []; for (let i = 0; i < 620; i++) a.push({ x: r() * W, y: r() * H * .8, s: r() * 1.7 + .35, p: r() * TAU, f: .6 + r() * 2.6, b: r() }); return a; })();
function stars(t, alpha, dx = 0, maxY = H * .8) {
  if (alpha <= 0) return;
  g.save(); g.fillStyle = '#fff';
  for (const s of STARS) {
    if (s.y > maxY) continue;
    const tw = .55 + .45 * Math.sin(t * s.f + s.p);
    const x = ((s.x + dx) % W + W) % W;
    g.globalAlpha = alpha * tw * (.3 + .7 * s.b) * (1 - s.y / maxY * .55);
    g.fillRect(x, s.y, s.s, s.s);
    if (s.b > .985) { g.globalAlpha *= .5; g.fillRect(x - 5, s.y + s.s / 2 - .4, 10 + s.s, .8); g.fillRect(x + s.s / 2 - .4, s.y - 5, .8, 10 + s.s); }
  }
  g.restore();
}
const DUST = (() => { const r = rng(11), a = []; for (let i = 0; i < 170; i++) a.push({ x: r() * W, y: r() * H, z: r(), p: r() * TAU, v: .3 + r() }); return a; })();
function dust(t, alpha, col = '255,214,150', up = 12, sway = 30) {
  if (alpha <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const d of DUST) {
    const y = ((d.y - t * up * (.5 + d.z) * d.v) % H + H) % H;
    const x = d.x + Math.sin(t * .4 * d.v + d.p) * sway * d.z;
    const a = alpha * (.2 + .8 * d.z) * (.6 + .4 * Math.sin(t * 1.3 + d.p));
    g.fillStyle = `rgba(${col},${a.toFixed(3)})`;
    g.beginPath(); g.arc(x, y, .8 + d.z * 2.6, 0, TAU); g.fill();
  }
  g.restore();
}
function ridge(seed, n = 256, rough = .55) {
  const r = rng(seed), a = new Float32Array(n + 1); a[0] = r(); a[n] = r();
  let step = n, amp = 1;
  while (step > 1) { const h = step / 2; for (let i = h; i < n; i += step) a[i] = (a[i - h] + a[i + h]) / 2 + (r() - .5) * amp; amp *= rough; step = h; }
  let mn = Infinity, mx = -Infinity; for (const v of a) { mn = Math.min(mn, v); mx = Math.max(mx, v); }
  for (let i = 0; i <= n; i++) a[i] = (a[i] - mn) / (mx - mn);
  return a;
}
const R1 = ridge(3), R2 = ridge(19, 256, .5), R3 = ridge(41, 256, .6), R4 = ridge(77, 256, .45);
function mountains(R, baseY, amp, fillTop, fillBot, dx = 0, rim = null, rimA = 0) {
  const n = R.length - 1, span = W * 1.3, x0 = -W * .15 + dx;
  g.beginPath(); g.moveTo(x0, H);
  for (let i = 0; i <= n; i++) g.lineTo(x0 + i / n * span, baseY - R[i] * amp);
  g.lineTo(x0 + span, H); g.closePath();
  const gr = g.createLinearGradient(0, baseY - amp, 0, H); gr.addColorStop(0, fillTop); gr.addColorStop(1, fillBot);
  g.fillStyle = gr; g.fill();
  if (rim) {
    g.save(); g.beginPath();
    for (let i = 0; i <= n; i++) { const X = x0 + i / n * span, Y = baseY - R[i] * amp; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }
    g.strokeStyle = rim; g.globalAlpha = rimA; g.lineWidth = 2; g.stroke(); g.restore();
  }
}
const duneFn = (baseY, amp, f, ph) => x => baseY + amp * Math.sin(x * f + ph) + amp * .45 * Math.sin(x * f * 2.3 + ph * 1.7 + 1.3) + amp * .18 * Math.sin(x * f * 5.1 + ph * .6);
function dune(fn, top, bot, rim, rimA, yTop) {
  const pts = []; for (let x = -10; x <= W + 10; x += 8) pts.push([x, fn(x)]);
  g.beginPath(); g.moveTo(-10, H); pts.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(W + 10, H); g.closePath();
  const gr = g.createLinearGradient(0, yTop, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fill();
  if (rim) { g.save(); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.strokeStyle = rim; g.globalAlpha = rimA; g.lineWidth = 2.2; g.stroke(); g.restore(); }
}
const MOON = (() => { const c = mk(220, 220), x = c.getContext('2d'); x.fillStyle = '#f7eed6'; x.shadowColor = 'rgba(255,240,200,.85)'; x.shadowBlur = 34; x.beginPath(); x.arc(110, 110, 46, 0, TAU); x.fill(); x.shadowBlur = 0; x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(131, 96, 44, 0, TAU); x.fill(); return c; })();
function rays(x, y, n, len, a, t, spread = Math.PI, dir = -Math.PI / 2, col = '255,220,150') {
  if (a <= .003) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.translate(x, y);
  for (let i = 0; i < n; i++) {
    const r = rng(i * 31 + 5), ang = dir + (r() - .5) * spread + Math.sin(t * .3 + i) * .03;
    const w = .012 + r() * .045, L = len * (.5 + r() * .6), aa = a * (.3 + .7 * r()) * (.65 + .35 * Math.sin(t * 1.1 + i * 1.7));
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, L); gr.addColorStop(0, `rgba(${col},${aa.toFixed(3)})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, L, ang - w, ang + w); g.closePath(); g.fill();
  }
  g.restore();
}
function strokePartial(pts, p) {
  if (p <= 0) return pts[0];
  let L = 0; const c = [0];
  for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); c.push(L); }
  const tgt = L * p; let head = pts[0];
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    if (c[i] <= tgt) { g.lineTo(pts[i][0], pts[i][1]); head = pts[i]; }
    else { const k = (tgt - c[i - 1]) / (c[i] - c[i - 1] || 1); head = [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; g.lineTo(head[0], head[1]); break; }
  }
  g.stroke(); return head;
}
function catmull(pts, closed, sg = 8) {
  const out = [], n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)], last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let s = 0; s < sg; s++) {
      const t = s / sg, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));

  out.push(closed ? out[0] : pts[n - 1]); return out;
}
function starPoly(n, k, R, rot = 0) { const pts = []; for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + rot + i * k * TAU / n; pts.push([Math.cos(a) * R, Math.sin(a) * R]); } return pts; }
function octagram(R) { const pts = []; for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + i * TAU / 16, r = i % 2 ? R * .76 : R; pts.push([Math.cos(a) * r, Math.sin(a) * r]); } return pts; }
function poly(pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function kaaba(x, y, s, light, t) {
  const fw = s, fh = s * 1.02, sw = s * .46, sk = s * .13;
  const L = x - fw * .62, R = L + fw;           // front face
  g.save();
  g.shadowColor = `rgba(255,190,110,${.55 * light})`; g.shadowBlur = 60 * light;
  g.fillStyle = '#0a0a0c'; g.fillRect(L, y - fh, fw, fh); g.shadowBlur = 0;
  g.beginPath(); g.moveTo(R, y); g.lineTo(R, y - fh); g.lineTo(R + sw, y - fh - sk); g.lineTo(R + sw, y - sk); g.closePath(); g.fillStyle = '#141418'; g.fill();
  g.beginPath(); g.moveTo(L, y - fh); g.lineTo(R, y - fh); g.lineTo(R + sw, y - fh - sk); g.lineTo(L + sw, y - fh - sk); g.closePath(); g.fillStyle = '#1b1b20'; g.fill();
  const by = y - fh * .76, bh = fh * .085; // embroidered band
  const gr = g.createLinearGradient(0, by, 0, by + bh); gr.addColorStop(0, '#f3d27e'); gr.addColorStop(1, '#9a6c26');
  g.fillStyle = gr; g.fillRect(L, by, fw, bh);
  g.beginPath(); g.moveTo(R, by); g.lineTo(R + sw, by - sk); g.lineTo(R + sw, by - sk + bh); g.lineTo(R, by + bh); g.closePath(); g.fillStyle = '#86602a'; g.fill();
  g.fillStyle = 'rgba(214,170,90,.85)'; g.fillRect(R - fw * .26, y - fh * .5, fw * .16, fh * .34); // door
  g.strokeStyle = `rgba(255,210,140,${.5 * light})`; g.lineWidth = 2;
  g.beginPath(); g.moveTo(L, y - fh); g.lineTo(L + sw, y - fh - sk); g.lineTo(R + sw, y - fh - sk); g.lineTo(R + sw, y - sk); g.stroke();

function palm(x, y, h, lean, col, t, ph = 0) {
  g.save(); g.fillStyle = col; g.strokeStyle = col;

  for (let i = 0; i < 6; i++) { g.lineWidth = h * (.05 - i * .006); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * h * .2, y - h * .5, tx, ty); g.stroke(); }

    const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * .55 + len * .32 * Math.abs(Math.cos(a));
    const mx = tx + Math.cos(a) * len * .5, my = ty + Math.sin(a) * len * .5 - len * .14;
    g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(mx, my - h * .03, ex, ey); g.quadraticCurveTo(mx, my + h * .03, tx, ty); g.fill();

const VIGNETTE = (() => { const c = mk(W, H), x = c.getContext('2d'); const gr = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); return c; })();
